# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/
#
# This workflow will
# 1. Build Python Wheel Nightly Version
# 2. Upload to PyPI

name: Python Package Build and Release (nightly)

on:
  workflow_dispatch:  # Allow manual triggers
  schedule:
    - cron: '0 7 * * *'
      timezone: 'America/Los_Angeles'

jobs:
  build-nightly:
    name: Build and Release Python Wheel Nightly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Build Nightly Package
        run: |
          python tools/build_wheels.py --type nightly

      - name: Upload Nightly Wheel
        uses: actions/upload-artifact@v4
        with:
          name: litert-cli-nightly-wheel
          path: dist/*.whl

  test-before-publish:
    needs: build-nightly
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    name: Test Install and Import litert-cli-nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Download Nightly Wheel
        uses: actions/download-artifact@v4
        with:
          name: litert-cli-nightly-wheel
          path: ./dist

      - name: Install litert-cli-nightly
        run: |
          python -m pip install dist/*.whl

      - name: Import litert-cli
        run: |
          python -c "import litert_cli"

  publish-nightly:
    name: Publish to PyPI
    needs: test-before-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Nightly Wheel
        uses: actions/download-artifact@v4
        with:
          name: litert-cli-nightly-wheel
          path: ./dist

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Clean up stale releases from staging repo
        run: |
          # clean up stale releases from staging repo
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="litert-cli--pypi" \
              --format="value(name)" 2>/dev/null)

          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project=""oss-exit-gate-prod"" \
                  --location=""us"" \
                  --repository="litert-cli--pypi" \
                  --quiet
          '

      - name: Stage to OSS Exit Gate and upload manifest
        run: |
          python3 -m pip install --upgrade pip twine
          python3 -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/litert-cli--pypi/" \
            -u oauth2accesstoken \
            -p "$(gcloud auth print-access-token)" \
            dist/*.whl
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/litert-cli/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"

  test-after-publish:
    needs: publish-nightly
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    name: Test Install and Import litert-cli-nightly from PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Install litert-cli-nightly from PyPI
        run: |
          python -m pip install litert-cli-nightly

      - name: Import litert-cli
        run: |
          python -c "import litert_cli"
